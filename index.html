<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>APK 提取</title>
<style>
  :root {
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --surface-alt: #EDF1F6;
    --ink: #1B2430;
    --ink-dim: #6B7A8A;
    --accent: #2F7FE8;
    --accent-press: #1F6BCC;
    --accent-soft: #E8F1FC;
    --divider: #E2E8F0;
    --item-selected: #E7F1FD;
    --item-focused: #D9E9F9;
    --radius: 12px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    overflow: hidden;
    overflow-x: hidden;
  }
  .app {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 14px calc(10px + var(--safe-b));
    gap: 8px;
    overflow: hidden;
    box-sizing: border-box;
  }
  header {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
  }
  .title { font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--ink); }
  .sub { color: var(--ink-dim); font-size: 12px; }
  .remote-tip {
    color: var(--accent);
    font-size: 11px;
    line-height: 1.45;
  }

  .search {
    flex-shrink: 0;
    width: 100%;
    height: 44px;
    border: 1px solid var(--divider);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    padding: 0 12px;
    outline: none;
  }
  .search:focus {
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 127, 232, 0.15);
  }
  .search::placeholder { color: var(--ink-dim); }

  .toolbar { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    border: 1px solid transparent;
    border-radius: 10px;
    height: 40px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s;
    outline: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn.ghost {
    flex: 1;
    background: var(--surface);
    color: var(--ink);
    border-color: var(--divider);
  }
  .btn.ghost:focus {
    border: 2px solid var(--accent);
    background: var(--accent-soft);
  }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    padding: 0 16px;
    height: 40px;
    min-width: 112px;
    font-size: 14px;
  }
  .btn.primary:focus {
    background: #4A96F0;
    border: 2px solid var(--accent-press);
  }
  .btn.primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .list-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 1px;
  }
  .list-wrap::-webkit-scrollbar { width: 4px; }
  .list-wrap::-webkit-scrollbar-thumb { background: #D0D7DE; border-radius: 4px; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 72px;
    min-width: 0;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    padding: 12px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--divider);
    cursor: pointer;
    user-select: none;
    outline: none;
    flex-shrink: 0;
    box-sizing: border-box;
    transition: background 0.12s, border-color 0.12s;
  }
  .item:active { background: var(--surface-alt); }
  .item:focus {
    border: 2px solid var(--accent);
    background: var(--item-focused);
  }
  .item.selected {
    border-color: var(--accent);
    background: var(--item-selected);
  }
  .item.selected:focus {
    border: 2px solid var(--accent-press);
    background: var(--item-selected);
  }
  .icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }
  .meta-wrap {
    flex: 1 1 0;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .name {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .meta {
    margin-top: 2px;
    font-size: 12px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #C5CDD6;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
  }
  .item.selected .check { background: var(--accent); border-color: var(--accent); }
  .item.selected .check::after {
    content: "";
    width: 6px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  /* 底部圆角卡片，高度收紧 */
  .bottom {
    flex-shrink: 0;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--divider);
    box-shadow: 0 2px 10px rgba(27, 36, 48, 0.06);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bottom .count { flex: 1; font-size: 15px; color: var(--ink); }
  .path {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    flex: 1;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    font-size: 15px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 110px;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--divider);
    box-shadow: 0 6px 24px rgba(27, 36, 48, 0.12);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    max-width: 86%;
    text-align: center;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(27, 36, 48, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  .overlay.show { display: flex; }
  .dialog {
    width: min(320px, 86%);
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(27, 36, 48, 0.16);
  }
  .dialog h3 { margin: 0 0 8px; font-size: 17px; color: var(--ink); }
  .dialog p { margin: 0; color: var(--ink-dim); font-size: 14px; }
  .spinner {
    width: 32px;
    height: 32px;
    margin: 12px auto 6px;
    border: 3px solid var(--divider);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-left: 6px;
    vertical-align: 1px;
  }

  @media (min-width: 720px) {
    .app { max-width: 720px; }
  }
</style>
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

<div class="app">
  <header>
    <div class="title">APK 提取</div>
    <div class="sub" id="itemCount">共 0 个应用</div>
    <div class="remote-tip" id="remoteTip">遥控器：↑↓ 选应用 · OK 勾选 · ←/→ 到提取 · 菜单 全选 · 返回 清空</div>
  </header>

  <input class="search" id="searchBox" type="search" placeholder="搜索应用名或包名" autocomplete="off" />

  <div class="toolbar">
    <button class="btn ghost" id="btnSelectAll">全选</button>
    <button class="btn ghost" id="btnClear">清空</button>
  </div>

  <div class="list-wrap" id="listWrap"></div>
  <div class="empty" id="emptyView">没有匹配的应用</div>

  <div class="bottom">
    <div class="count" id="selectedCount">已选 0 个</div>
    <button class="btn primary" id="btnExtract" disabled>提取选中</button>
  </div>
  <div class="path" id="savePath">保存到：/Download/APK提取</div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h3 id="dialogTitle">正在提取…</h3>
    <div class="spinner" id="spinner"></div>
    <p id="dialogMsg">0 / 0</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const APPS = [
    { name: "微信", pkg: "com.tencent.mm", ver: "8.0.49", size: 268435456, color: "#07C160", split: true },
    { name: "支付宝", pkg: "com.eg.android.AlipayGphone", ver: "10.5.88", size: 189582540, color: "#1677FF", split: true },
    { name: "哔哩哔哩", pkg: "tv.danmaku.bili", ver: "7.62.0", size: 120586240, color: "#FB7299", split: true },
    { name: "抖音", pkg: "com.ss.android.ugc.aweme", ver: "32.5.0", size: 210763776, color: "#111111", split: true },
    { name: "网易云音乐", pkg: "com.netease.cloudmusic", ver: "9.0.50", size: 98720215, color: "#C20C0C", split: true },
    { name: "高德地图", pkg: "com.autonavi.minimap", ver: "13.18.0", size: 154140672, color: "#00A6FF", split: true },
    { name: "QQ", pkg: "com.tencent.mobileqq", ver: "9.0.30", size: 245366784, color: "#12B7F5", split: true },
    { name: "淘宝", pkg: "com.taobao.taobao", ver: "10.35.0", size: 176160768, color: "#FF5000", split: true },
    { name: "钉钉", pkg: "com.alibaba.android.rimet", ver: "7.6.10", size: 134217728, color: "#1E8FFF", split: true },
    { name: "WPS Office", pkg: "cn.wps.moffice_eng", ver: "18.2.1", size: 89128960, color: "#E23A2E", split: true },
    { name: "百度网盘", pkg: "com.baidu.netdisk", ver: "12.13.0", size: 117440512, color: "#2E6CFF", split: true },
    { name: "腾讯视频", pkg: "com.tencent.qqlive", ver: "8.10.25", size: 230686720, color: "#FF6022", split: true },
    { name: "爱奇艺", pkg: "com.qiyi.video", ver: "15.9.0", size: 167772160, color: "#00BE06", split: true },
    { name: "应用宝", pkg: "com.tencent.android.qqdownloader", ver: "8.9.5", size: 76546048, color: "#2CAAE5", split: false },
    { name: "系统更新", pkg: "com.android.updater", ver: "1.0", size: 12582912, color: "#607D8B", split: false },
    { name: "文件管理", pkg: "com.android.fileexplorer", ver: "5.2.1", size: 20971520, color: "#FFB300", split: false },
  ];

  const els = {
    list: document.getElementById("listWrap"),
    empty: document.getElementById("emptyView"),
    search: document.getElementById("searchBox"),
    count: document.getElementById("selectedCount"),
    itemCount: document.getElementById("itemCount"),
    extract: document.getElementById("btnExtract"),
    selectAll: document.getElementById("btnSelectAll"),
    clear: document.getElementById("btnClear"),
    overlay: document.getElementById("overlay"),
    dialogMsg: document.getElementById("dialogMsg"),
    dialogTitle: document.getElementById("dialogTitle"),
    spinner: document.getElementById("spinner"),
    toast: document.getElementById("toast"),
  };

  let focusZone = "list";
  let listIndex = 0;

  function formatSize(bytes) {
    if (bytes <= 0) return "—";
    const kb = bytes / 1024;
    if (kb < 1024) return kb.toFixed(0) + " KB";
    const mb = kb / 1024;
    if (mb < 1024) return mb.toFixed(1) + " MB";
    return (mb / 1024).toFixed(2) + " GB";
  }

  function itemEls() {
    return Array.from(els.list.querySelectorAll(".item"));
  }

  function syncFocusStyles() {
    if (focusZone === "list") {
      const items = itemEls();
      if (items.length) {
        listIndex = Math.max(0, Math.min(listIndex, items.length - 1));
        items[listIndex].focus({ preventScroll: false });
      }
    } else if (focusZone === "search") {
      els.search.focus();
    } else if (focusZone === "toolbar") {
      els.selectAll.focus();
    } else if (focusZone === "extract") {
      els.extract.focus();
    }
  }

  function render() {
    const q = els.search.value.trim().toLowerCase();
    const shown = APPS.filter(a =>
      !q || a.name.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q)
    );

    els.itemCount.textContent = "共 " + APPS.length + " 个应用";
    els.list.innerHTML = "";

    if (shown.length === 0) {
      els.empty.style.display = "flex";
      els.list.style.display = "none";
    } else {
      els.empty.style.display = "none";
      els.list.style.display = "flex";
      shown.forEach((app) => {
        const item = document.createElement("div");
        item.className = "item" + (app.selected ? " selected" : "");
        item.setAttribute("tabindex", "-1");
        item.innerHTML =
          '<div class="icon" style="background:' + app.color + '">' +
            app.name.slice(0, 1) +
          "</div>" +
          '<div class="meta-wrap">' +
            '<div class="name">' +
              app.name +
              (app.split ? '<span class="badge">split</span>' : "") +
            "</div>" +
            '<div class="meta">' +
              app.pkg + "  ·  v" + app.ver + "  ·  " + formatSize(app.size) +
            "</div>" +
          "</div>" +
          '<div class="check"></div>';
        // 直接绑在元素上，保证点到子元素也能切换
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          app.selected = !app.selected;
          item.classList.toggle("selected", app.selected);
          updateCount();
        });
        els.list.appendChild(item);
      });
    }
    updateCount();
    syncFocusStyles();
  }

  function updateCount() {
    const n = APPS.filter(a => a.selected).length;
    els.count.textContent = "已选 " + n + " 个";
    els.extract.disabled = n === 0;
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove("show"), 2600);
  }

  function toggleAt(i) {
    const items = itemEls();
    if (!items[i]) return;
    items[i].click();
  }

  function visibleApps() {
    const q = els.search.value.trim().toLowerCase();
    return APPS.filter(a =>
      !q || a.name.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q)
    );
  }

  els.search.addEventListener("input", () => {
    render();
    focusZone = "search";
  });

  els.selectAll.addEventListener("click", () => {
    visibleApps().forEach(a => (a.selected = true));
    render();
  });
  els.clear.addEventListener("click", () => {
    APPS.forEach(a => (a.selected = false));
    render();
    showToast("已清空勾选");
  });
  els.extract.addEventListener("click", () => {
    const selected = APPS.filter(a => a.selected);
    if (!selected.length) return;

    els.overlay.classList.add("show");
    els.dialogTitle.textContent = "正在提取…";
    els.spinner.style.display = "block";
    els.dialogMsg.textContent = "0 / " + selected.length;

    let i = 0;
    const tick = () => {
      i++;
      els.dialogMsg.textContent = i + " / " + selected.length;
      if (i < selected.length) {
        setTimeout(tick, 280);
      } else {
        setTimeout(() => {
          els.overlay.classList.remove("show");
          els.spinner.style.display = "none";
          selected.forEach(a => (a.selected = false));
          render();
          showToast("提取完成：" + selected.length + " 个文件 → /Download/APK提取");
          focusZone = "list";
          syncFocusStyles();
        }, 320);
      }
    };
    setTimeout(tick, 280);
  });

  document.addEventListener("keydown", (e) => {
    const items = itemEls();
    const selectedN = APPS.filter(a => a.selected).length;

    switch (e.key) {
      case "ArrowDown":
        e.preventDefault();
        if (focusZone !== "list") {
          focusZone = "list";
          listIndex = 0;
        } else {
          listIndex = Math.min(items.length - 1, listIndex + 1);
        }
        syncFocusStyles();
        break;
      case "ArrowUp":
        e.preventDefault();
        if (focusZone === "list") {
          if (listIndex > 0) listIndex--;
          else focusZone = "toolbar";
        } else if (focusZone === "toolbar") {
          focusZone = "search";
        }
        syncFocusStyles();
        break;
      case "ArrowLeft":
      case "ArrowRight":
        e.preventDefault();
        if (focusZone === "list" && selectedN > 0) focusZone = "extract";
        else if (focusZone === "extract") focusZone = "list";
        syncFocusStyles();
        break;
      case "Enter":
      case " ":
        e.preventDefault();
        if (focusZone === "list") toggleAt(listIndex);
        else if (focusZone === "extract") els.extract.click();
        else if (focusZone === "toolbar") els.selectAll.click();
        break;
      case "Escape":
        if (selectedN > 0) {
          APPS.forEach(a => (a.selected = false));
          render();
          showToast("已清空勾选");
        } else if (els.search.value) {
          els.search.value = "";
          render();
        }
        break;
      case "m":
      case "M":
      case "F1":
        e.preventDefault();
        visibleApps().forEach(a => (a.selected = true));
        render();
        break;
      default:
        break;
    }
  });

  els.list.addEventListener("click", (e) => {
    const item = e.target.closest(".item");
    if (!item) return;
    const idx = itemEls().indexOf(item);
    if (idx >= 0) listIndex = idx;
  });

  const PRESELECT = parseInt(
    new URLSearchParams(location.search).get("select") || "0",
    10
  );

  render();
  if (PRESELECT > 0) {
    APPS.forEach((a, i) => {
      if (i < PRESELECT) a.selected = true;
    });
    render();
  }
  focusZone = "list";
  listIndex = 0;
  syncFocusStyles();
})();
</script>
</body>
</html>
